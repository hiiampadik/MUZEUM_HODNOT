name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

  # Triggered by the Sanity webhook on publish
  repository_dispatch:
    types: [sanity-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Trailing-edge debounce for content rebuilds: a publish in Studio waits for a
  # quiet window, and any further publish cancels this run (see `concurrency`
  # above) and restarts the wait. Coalesces an editing burst into one build.
  # Code pushes and manual runs skip the wait.
  debounce:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for further content edits
        run: sleep 120

  build:
    needs: debounce
    # Needed because a skipped `needs` would otherwise skip `build` too.
    # `!cancelled()` rather than `always()`: `always()` runs the job even when the
    # run is cancelled, which would defeat the debounce.
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.debounce.result) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No .next cache restore here on purpose: content-triggered rebuilds must
      # run clean, otherwise a stale prerender can serve old Sanity content
      # (see CLAUDE.md "Clean builds for content changes").
      - name: Build with Next.js
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    # The implicit `success()` checks every ancestor job, including the skipped
    # `debounce`, so without an explicit condition deploy is skipped on pushes.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
